name: server-ci

on:
  push:
    branches: [main]
    paths:
      - "server/**"
      - ".github/workflows/server-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "server/**"
      - ".github/workflows/server-ci.yml"
  workflow_dispatch:

jobs:
  quality:
    name: Test, lint, security, format, and coverage
    runs-on: ubuntu-latest
    env:
      COVERAGE_THRESHOLD: "35.0"

    defaults:
      run:
        working-directory: server

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum

      - name: Echo Go version
        run: go version

      - name: Install staticcheck
        run: go install honnef.co/go/tools/cmd/staticcheck@latest

      - name: Check formatting
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "The following files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: Run linting
        run: staticcheck ./...

      - name: Run tests
        run: go test -covermode=atomic -coverprofile=coverage.out ./...

      - name: Install gosec
        run: go install github.com/securego/gosec/v2/cmd/gosec@latest

      - name: Run security checks
        run: gosec ./...

      - name: Check code coverage
        run: |
          coverage_report="$(go tool cover -func=coverage.out)"
          echo "$coverage_report" > coverage.txt
          echo "$coverage_report"

          coverage="$(echo "$coverage_report" | awk '/^total:/ { gsub(/%/, "", $3); print $3 }')"
          awk -v coverage="$coverage" -v threshold="$COVERAGE_THRESHOLD" 'BEGIN {
            if (coverage + 0 < threshold + 0) {
              printf "Coverage %.1f%% is below required %.1f%%\n", coverage, threshold
              exit 1
            }
            printf "Coverage %.1f%% meets required %.1f%%\n", coverage, threshold
          }'

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: server-coverage
          path: |
            server/coverage.out
            server/coverage.txt
          if-no-files-found: error
