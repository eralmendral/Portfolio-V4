<div class="AppShell">
  <button
    class="ThemeToggle"
    type="button"
    [class.ThemeToggleDark]="theme.isDarkMode()"
    [attr.aria-label]="theme.toggleLabel()"
    [attr.aria-pressed]="theme.isDarkMode()"
    [title]="theme.toggleLabel()"
    (click)="toggleTheme()"
  >
    <span class="ThemeToggleTrack" aria-hidden="true">
      <span class="ThemeToggleOption">
        <hugeicons-icon
          [icon]="sunIcon"
          [size]="18"
          [strokeWidth]="1.8"
        />
      </span>
      <span class="ThemeToggleOption">
        <hugeicons-icon
          [icon]="moonIcon"
          [size]="18"
          [strokeWidth]="1.8"
        />
      </span>
      <span class="ThemeToggleThumb">
        <hugeicons-icon
          [icon]="theme.isDarkMode() ? moonIcon : sunIcon"
          [size]="20"
          [strokeWidth]="1.8"
        />
      </span>
    </span>
    <span class="ScreenReaderOnly">{{ theme.activeLabel() }}</span>
  </button>

  <router-outlet />
</div>
