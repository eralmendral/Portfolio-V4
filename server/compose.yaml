services:
  app:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ADDR: ":8080"
      DATABASE_URL: "postgres://portfolio:portfolio@postgres:5432/portfolio?sslmode=disable"
      ADMIN_USERNAME: "${ADMIN_USERNAME:-admin}"
      ADMIN_PASSWORD: "${ADMIN_PASSWORD:-change-me}"
      JWT_SECRET: "${JWT_SECRET:-development-secret-change-me}"
      JWT_ISSUER: "${JWT_ISSUER:-portfolio-server}"
      TOKEN_TTL: "${TOKEN_TTL:-24h}"
      CLIENT_ORIGINS: "${CLIENT_ORIGINS:-http://localhost:4200,http://127.0.0.1:4200}"
      SENTRY_DSN: "${SENTRY_DSN:-}"
      SENTRY_ENVIRONMENT: "${SENTRY_ENVIRONMENT:-development}"
      SENTRY_RELEASE: "${SENTRY_RELEASE:-}"
      LOG_LEVEL: "${LOG_LEVEL:-info}"
      UPLOAD_STORAGE: "${UPLOAD_STORAGE:-local}"
      UPLOAD_DIR: "/app/public/uploads/projects"
      UPLOAD_BASE_URL: "/uploads/projects"
      MAX_UPLOAD_BYTES: "${MAX_UPLOAD_BYTES:-314572800}"
    ports:
      - "8080:8080"
    volumes:
      - uploads:/app/public/uploads/projects
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: portfolio
      POSTGRES_USER: portfolio
      POSTGRES_PASSWORD: portfolio
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U portfolio -d portfolio"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  postgres-data:
  uploads:
